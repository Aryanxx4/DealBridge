# Render Blueprint: one web service (backend + built frontend in a single container) and a PostgreSQL database.
# Qdrant runs on Qdrant Cloud (free tier); its URL and API key are entered in the Render dashboard.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: dealbridge-db
    plan: free
    region: singapore
    databaseName: dealbridge
    user: dealbridge
    ipAllowList: []  # reachable only from services in this Render account

services:
  - type: web
    name: dealbridge
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dealbridge-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      # Secrets: Render asks for these when the Blueprint is created.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      # LLM: Cerebras (OpenAI-compatible). LLM_PROVIDER is only a label and stays "openrouter".
      - key: LLM_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: LLM_MODEL
        value: qwen-3.8-27b
      - key: LLM_FAST_MODEL
        value: qwen-3.8-27b
      - key: LLM_REASONING_EFFORT
        value: none
