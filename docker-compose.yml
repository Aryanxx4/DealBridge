name: dealbridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealbridge
      POSTGRES_PASSWORD: dealbridge
      POSTGRES_DB: dealbridge
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - dealbridge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealbridge -d dealbridge"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - dealbridge_qdrant:/qdrant/storage
    healthcheck:
      # The qdrant image ships bash but not curl/wget; probe the /readyz endpoint over /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dealbridge_pg:
  dealbridge_qdrant:
